<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空耳アワーデータベース</title>
<meta name="description" content="タモリ倶楽部「空耳アワー」の全作品を検索できるデータベース">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>空耳アワーデータベース</h1>
  <p id="lead">読み込み中…</p>
</header>

<main>
  <form id="filters" class="filters" autocomplete="off">
    <label class="field">
      <span>アーティスト名</span>
      <input type="search" name="artist" list="artist-list" placeholder="ビートルズ / The Beatles">
      <datalist id="artist-list"></datalist>
    </label>
    <label class="field">
      <span>曲名</span>
      <input type="search" name="title">
    </label>
    <label class="field wide">
      <span>フリーワード（空耳・原詞・その他の評価）</span>
      <input type="search" name="q" placeholder="スペース区切りで AND 検索">
    </label>
    <div class="field">
      <span id="date-label">放送日</span>
      <div class="date-range" role="group" aria-labelledby="date-label">
        <input type="date" name="from" aria-label="開始日">
        <span aria-hidden="true">〜</span>
        <input type="date" name="to" aria-label="終了日">
      </div>
    </div>
    <label class="field">
      <span>特番</span>
      <select name="special"></select>
    </label>
    <fieldset class="field wide">
      <legend>評価</legend>
      <div id="rating-checks" class="checks"></div>
    </fieldset>
    <div class="actions">
      <button type="reset">条件をクリア</button>
    </div>
  </form>

  <section aria-labelledby="counts-title" class="counts-section">
    <h2 id="counts-title">期間内の評価数</h2>
    <p id="counts-note" class="note"></p>
    <div id="counts" class="counts"></div>
  </section>

  <section aria-labelledby="results-title">
    <div class="results-head">
      <h2 id="results-title">作品</h2>
      <p id="result-count" aria-live="polite"></p>
      <label class="sort-mobile">
        <span>並び替え</span>
        <select id="sort-select"></select>
      </label>
    </div>
    <div class="table-wrap">
      <table id="works">
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <nav id="pager" class="pager" aria-label="ページ"></nav>
  </section>
</main>

<footer class="site-footer">
  <p>データの出典は<a href="https://www7a.biglobe.ne.jp/~soramimiupdate/">空耳アワーアップデート</a>と<a href="http://soranari001.web.fc2.com/soramimi_data_classification.html">空耳アワー詳細データ分類一覧表</a>です。複数の賞品を受け取った作品は、高い方の賞品で数えています。</p>
  <p><a href="https://github.com/expajp/soramimi-hour-update-database">データと収集スクリプト</a></p>
</footer>
<script src="app.js"></script>
</body>
</html>
